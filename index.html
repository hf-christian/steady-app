<style>
/* Design system: Steady premium wellness (Mark's brief, 2026-11-10). Tokens first, then components. Same class names as before. */
:root {
  /* colour: forest green brand, sage highlights, muted coral only for help */
  --bg: #f5f7f4; --surface: #ffffff; --subtle: #edf2ee; --ink: #25352f; --muted: #6a7a72; --line: #e4eae5;
  --accent: #245b4a; --accent-ink: #ffffff; --accent-soft: #dcebe2;
  --gold: #9a6b1e; --gold-soft: #f4ead3; --warn: #a2582b; --warn-soft: #f6e8dc;
  --help: #b4553f; --help-soft: #f8e8e3; --help-ink: #ffffff; --help-text: #9a4431;
  --px-ink: #1f2f2a; --px-white: #ffffff; --px-teal: #3e8f74; --px-gold: #e0a43a; --px-red: #d2614a; --px-grey: #a9b6b0; --px-brown: #8a5a2b;
  --mood-1: #e7ebf1; --mood-2: #eeeaf3; --mood-3: #eef0ea; --mood-4: #e2efe6; --mood-5: #f6eedb;
  --shadow-sm: 0 1px 2px rgb(30 50 40 / 0.04), 0 2px 8px rgb(30 50 40 / 0.05);
  --shadow-md: 0 2px 6px rgb(30 50 40 / 0.06), 0 10px 28px rgb(30 50 40 / 0.08);
  /* type */
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  /* shape and space */
  --radius: 20px; --radius-md: 14px; --radius-sm: 10px; --pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px;
  --control: 44px; --ease: cubic-bezier(.2, .7, .2, 1);
  /* every card: a soft sage wash at the top fading into the surface (Mark, 2026-11-11). Fixed length, so short and tall cards match. */
  --card-bg: linear-gradient(180deg, var(--accent-soft) 0px, var(--surface) 240px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1613; --surface: #17211c; --subtle: #131c18; --ink: #e4ece7; --muted: #9cada4; --line: #26332d;
  --accent: #8ccbb0; --accent-ink: #0c1f18; --accent-soft: #1e332a;
  --gold: #e2b866; --gold-soft: #3a311b; --warn: #e0a36f; --warn-soft: #362818;
  --help: #e8957f; --help-soft: #34221d; --help-ink: #2a120b; --help-text: #eea08c;
  --px-ink: #0a120e; --px-white: #e3ece7; --px-teal: #6dbf9c; --px-gold: #eab654; --px-red: #e87a62; --px-grey: #7f928a; --px-brown: #b98a5a;
  --mood-1: #1d232c; --mood-2: #241f2c; --mood-3: #1f2520; --mood-4: #1b2b22; --mood-5: #2c2718;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.25); --shadow-md: 0 6px 24px rgb(0 0 0 / 0.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #17211c; --subtle: #131c18; --ink: #e4ece7; --muted: #9cada4; --line: #26332d;
  --accent: #8ccbb0; --accent-ink: #0c1f18; --accent-soft: #1e332a;
  --gold: #e2b866; --gold-soft: #3a311b; --warn: #e0a36f; --warn-soft: #362818;
  --help: #e8957f; --help-soft: #34221d; --help-ink: #2a120b; --help-text: #eea08c;
  --px-ink: #0a120e; --px-white: #e3ece7; --px-teal: #6dbf9c; --px-gold: #eab654; --px-red: #e87a62; --px-grey: #7f928a; --px-brown: #b98a5a;
  --mood-1: #1d232c; --mood-2: #241f2c; --mood-3: #1f2520; --mood-4: #1b2b22; --mood-5: #2c2718;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.25); --shadow-md: 0 6px 24px rgb(0 0 0 / 0.35); color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1140px; margin: 0 auto; padding-block: var(--s6) calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: var(--s5); }
.view { display: flex; flex-direction: column; gap: var(--s5); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 1.6rem + 1.4vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }

/* icons: Lucide line icons */
.ic { display: block; flex: none; }
/* habit and reward icons: pixel art from 12x12 grids */
.px { display: block; flex: none; image-rendering: pixelated; }
.px .k { fill: var(--px-ink); } .px .w { fill: var(--px-white); } .px .a { fill: var(--px-teal); } .px .g { fill: var(--px-gold); }
.px .r { fill: var(--px-red); } .px .m { fill: var(--px-grey); } .px .n { fill: var(--px-brown); }
.tile { display: grid; place-items: center; border-radius: var(--radius-md); background: var(--subtle); border: 1px solid var(--line); color: var(--accent); flex: none; }
.tile.lg { width: 60px; height: 60px; border-radius: 18px; } .tile.md { width: 46px; height: 46px; } .tile.sm { width: 32px; height: 32px; border-radius: var(--radius-sm); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: var(--s2); }
.picker button { min-height: 52px; padding: 6px; border-radius: var(--radius-md); background: var(--subtle); border: 1.5px solid transparent; color: var(--accent); box-shadow: none; }
.picker button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.picker button:hover { border-color: var(--line); }
.picker button[aria-checked="true"]:hover { border-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
legend { font-weight: 700; font-size: 0.95rem; padding: 0; margin-bottom: var(--s2); }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
header.top .brand .eyebrow { letter-spacing: 0.12em; font-weight: 600; opacity: .9; }

/* buttons: one height, one radius, quiet borders */
button, .btn { font: inherit; font-weight: 700; font-size: 0.95rem; border-radius: var(--pill); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--control);
  transition: background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease), transform .12s var(--ease); }
button:hover, .btn:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
button:active, .btn:active { transform: scale(0.97); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
.ghost { background: transparent; }
.back { padding-left: 12px; color: var(--muted); border-color: transparent; }
.back:hover { color: var(--ink); background: var(--surface); }
.danger { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--warn); background: transparent; }
.row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.reminder-form { display: flex; flex-direction: column; gap: var(--s3); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
button.link { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: none; }

/* cards: clean surfaces, soft shadows instead of heavy borders */
.card { background: var(--card-bg); border: 1px solid transparent; border-radius: var(--radius); padding: var(--s6); display: flex; flex-direction: column; gap: var(--s4); min-width: 0; box-shadow: var(--shadow-sm); }
.checkin { background: var(--card-bg); }
.checkin h2 { margin: 0; }
.checkin .row .primary { min-width: 132px; }
.with-ic { display: flex; align-items: center; gap: 10px; }
.tick { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--pill); background: var(--accent); color: var(--accent-ink); }
.habit { cursor: pointer; text-align: left; width: 100%; font-weight: 400; align-items: stretch; gap: var(--s4); }
.habit:hover { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow: var(--shadow-md); }
.habit-head { display: flex; align-items: center; gap: var(--s3); width: 100%; }
.habit-head .brand { flex: 1 1 auto; }
.habit-head .brand button.link { margin-top: 4px; align-self: flex-start; }
.icon-panel { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line); }
.tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--pill); background: var(--accent-soft); color: var(--accent); white-space: nowrap; align-self: flex-start; border: 0; }
.tag.example { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 600; letter-spacing: 0.06em; }

/* streak, week strip and stats */
.run-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; }
.run { display: flex; align-items: baseline; gap: var(--s2); }
.run .big { font-family: var(--display); font-weight: 700; font-size: 3.6rem; line-height: 0.9; letter-spacing: -0.03em; color: var(--ink); }
.week { display: flex; gap: 6px; }
.week .day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week .day i { width: 14px; height: 14px; border-radius: var(--pill); background: var(--subtle); border: 1.5px solid var(--line); display: block; }
.week .day.clean i { background: var(--accent); border-color: var(--accent); }
.week .day.slip i { background: transparent; border: 2px solid var(--gold); }
.week .day.today i { background: var(--accent-soft); border: 2px solid var(--accent); }
.week .day.future i { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, transparent); }
.week .day.future small, .week .day.none small { opacity: .6; }
.week .day.today small { color: var(--ink); }
.week .day small { font-size: 0.62rem; color: var(--muted); font-weight: 700; line-height: 1; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; background: var(--subtle); border-radius: var(--radius-md); padding: var(--s3) 0; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0 var(--s4); }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: var(--pill); background: var(--subtle); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: var(--pill); transform-origin: left; }
.next { display: flex; flex-direction: column; gap: var(--s2); width: 100%; }
.next-reward { display: flex; align-items: center; gap: var(--s3); }
.next-reward .tile { background: var(--gold-soft); color: var(--gold); }

/* lists and chips */
.list { display: flex; flex-direction: column; }
.item { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .label { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
.item.tip .label { gap: 4px; }
.tip a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
.chip { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: var(--pill); white-space: nowrap; }
.chip.done { background: var(--gold-soft); color: var(--gold); }
.chip.todo { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.chip.claimed { background: var(--accent-soft); color: var(--accent); }

/* notices */
.notice { border-radius: var(--radius-md); padding: var(--s5); background: var(--warn-soft); color: var(--ink); display: flex; flex-direction: column; gap: var(--s2); border: 0; }
.notice h3 { color: var(--warn); }
.notice ul { margin: 0; padding-left: 20px; }
.soft { background: var(--accent-soft); border-color: transparent; }
.soft h3 { color: var(--accent); }

/* forms */
form { display: flex; flex-direction: column; gap: var(--s4); }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 0.95rem; }
input, select, textarea { font: inherit; font-weight: 400; padding: 11px 14px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--subtle); color: var(--ink); min-height: var(--control); width: 100%;
  transition: border-color .18s var(--ease), background-color .18s var(--ease); }
input:focus, select:focus, textarea:focus { background: var(--surface); border-color: var(--accent); }
textarea { min-height: 110px; resize: vertical; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); }
.check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; }
.check input { width: 22px; min-height: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }

.kept { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.kept .stat { background: var(--subtle); border-radius: var(--radius-md); padding: var(--s3); border: 0; }

/* help lines */
.phone { font-family: var(--display); font-size: 1.35rem; font-weight: 700; user-select: all; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.help-line { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.help-line:first-of-type { border-top: 0; }
.help-line .label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.btn.call { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* help that stands out (ADR 0007 Part 4): muted coral, its own colour */
.urgent-btn { background: var(--help-soft); border-color: transparent; color: var(--help-text); }
.urgent-btn:hover { border-color: color-mix(in srgb, var(--help) 40%, transparent); }
.help-fab { position: fixed; z-index: 15; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border: 1px solid color-mix(in srgb, var(--help) 35%, var(--line)); color: var(--help-text); box-shadow: var(--shadow-md); }
.help-fab::before { content: ""; width: 8px; height: 8px; border-radius: var(--pill); background: var(--help); }
/* Emergency: the most prominent thing on Get help. Crisis support: a clean white card with a quieter coral Call. */
.card.urgent { background: var(--help-soft); border: 1px solid color-mix(in srgb, var(--help) 28%, transparent); box-shadow: var(--shadow-sm); gap: var(--s3); }
.card.urgent .eyebrow { color: var(--help-text); }
.card.urgent h2 { font-size: 1.5rem; }
.card.urgent .phone { font-size: 2.4rem; letter-spacing: -0.02em; line-height: 1.1; }
.card.urgent .btn.call { background: var(--help); border-color: var(--help); color: var(--help-ink); min-width: 124px; min-height: 52px; font-size: 1.05rem; box-shadow: var(--shadow-sm); }
.card.urgent button.ghost { background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: transparent; }
.card.urgent .help-line { border-top-color: color-mix(in srgb, var(--help) 22%, transparent); }
.card.crisis .dot { width: 10px; height: 10px; border-radius: var(--pill); background: var(--help); flex: none; }
.card.crisis .btn.call { background: var(--help-soft); border-color: transparent; color: var(--help-text); }
.card.crisis .btn.call:hover { border-color: color-mix(in srgb, var(--help) 40%, transparent); }
/* light/dark switch: small, home screen only */
.theme-switch { min-height: 30px; padding: 3px; gap: 2px; border-radius: var(--pill); background: var(--subtle); border: 1px solid var(--line); align-self: flex-start; margin-bottom: var(--s2); box-shadow: none; }
.theme-switch .ico { width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--pill); color: var(--muted); transition: background-color .25s var(--ease), color .25s var(--ease); }
.theme-switch[aria-checked="false"] .sun, .theme-switch[aria-checked="true"] .moon { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
/* daily journal (DDD 7.10) */
.mood-card { gap: var(--s3); }
.mood-card form { gap: var(--s5); }
.hint { display: block; text-align: center; margin: 2px 0 var(--s1); letter-spacing: 0.14em; }
legend.hint { width: 100%; }
/* five soft circles: each mood has its own gentle tint, the same in shape in both themes */
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); justify-items: center; }
.mood { flex-direction: column; gap: 10px; padding: 4px 0; min-height: 0; width: 100%; background: none; border: 0; box-shadow: none; color: var(--muted); font-size: 0.78rem; font-weight: 700; border-radius: var(--radius-md); }
.mood:hover, .mood[aria-pressed="true"] { background: none; border: 0; }
.mood .disc { width: min(58px, 100%); aspect-ratio: 1; }
.disc { display: grid; place-items: center; border-radius: var(--pill); background: var(--mood-bg, var(--subtle)); border: 1.5px solid transparent; flex: none;
  transition: transform .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease), background-color .28s var(--ease); }
.mood-card .with-ic .disc { width: 44px; height: 44px; }
.m1 { --mood-bg: var(--mood-1); } .m2 { --mood-bg: var(--mood-2); } .m3 { --mood-bg: var(--mood-3); } .m4 { --mood-bg: var(--mood-4); } .m5 { --mood-bg: var(--mood-5); }
.mood:hover .disc { transform: translateY(-2px); }
.mood[aria-pressed="true"] .disc { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow-sm); transform: scale(1.06); }
.mood[aria-pressed="true"] .word { color: var(--ink); }
.mood .word { transition: color .28s var(--ease); }
.face { display: inline-block; vertical-align: middle; flex: none; transition: transform .28s var(--ease); }
.mood[aria-pressed="true"] .face { transform: scale(1.04); }
/* note field with an icon, rounded habit chips, a wide "Log mood" button */
.field-ic { position: relative; display: block; }
.field-ic .ic { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.field-ic textarea { padding-left: 42px; min-height: 96px; border-radius: var(--radius-md); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip-tag { min-height: 36px; padding: 6px 14px; font-size: 0.85rem; font-weight: 600; background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: none; }
.chip-tag[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wide { width: 100%; min-height: 52px; font-size: 1rem; }
.row.center { justify-content: center; }
#lowMood:empty { display: none; }
#jOtherWrap { display: block; margin-top: 10px; }
#jOtherWrap[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.entry { display: flex; flex-direction: column; gap: 4px; padding: var(--s3) 0; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }

.demo { border: 1px dashed var(--line); border-radius: var(--radius); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
footer { font-size: 0.8rem; color: var(--muted); text-align: center; padding-top: var(--s2); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 18px; border-radius: var(--pill); font-weight: 700; z-index: 20; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow-md); }

/* screen layouts: stacked on phones */
.home-grid, .detail-grid, .help-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); align-items: start; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
.col { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.narrow { width: 100%; max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s5); }
.side-add { display: none; }

@media (min-width: 720px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .help-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  .wrap { padding-top: 40px; gap: var(--s6); }
  .home-grid { grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s6); }
  .home-grid .col.side { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); }
  .detail-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--s6); }
  .side-add { display: inline-flex; }
  .mobile-add { display: none; }
}
@media (max-width: 380px) { .kept { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stat { padding: 0 var(--s3); } .two { grid-template-columns: minmax(0, 1fr); } .run .big { font-size: 3rem; } }

/* motion: short and purposeful, and none at all for people who ask for less */
@media (prefers-reduced-motion: no-preference) {
  body, .card, .stats, .tile { transition: background-color .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease); }
  .view { animation: rise .26s var(--ease); }
  @keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }
  .habit { transition: box-shadow .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease); }
  .habit:hover { transform: translateY(-2px); }
  .bar > i { animation: fill .7s var(--ease) both; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .mood[aria-pressed="true"] .face { animation: settle .36s var(--ease); }
  @keyframes settle { 0% { transform: scale(.9); } 60% { transform: scale(1.1); } 100% { transform: scale(1.04); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .checkin.done .tick { animation: pop .4s var(--ease); }
  .week .day.today i { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); } }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

function progress(h) {

  const slips = [...new Set(h.slips)].sort();

  const clean = Math.max(0, elapsed - pastSlips);
  const last = slips.length ? slips[slips.length - 1] : h.start;
  const run = Math.max(0, dayNum(today) - dayNum(last));
  let longest = 0, prev = h.start;
  for (const s of slips) { longest = Math.max(longest, dayNum(s) - dayNum(prev)); prev = s; }
  longest = Math.max(longest, run);
  const saved = clean * (Number(h.cost) || 0);
  const next = MILESTONES.find(([d]) => d > clean);

  return { clean, run, longest, saved, next, prevM, slipToday: slips.includes(today) };

// A calendar file with one daily repeating event. Floating local time (no time zone), so it follows the phone.

  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Steady//Daily check-in//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', `UID:steady-checkin-${utc}@steady.app`, `DTSTAMP:${utc}`,
    `DTSTART:${startKey.replace(/-/g, '')}T${hh}${mm}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',

// DDD 8.1 / ADR 0010: coping tips, each with its source and the date Claude checked it, linking to the page.

// Emergency numbers for the big Call buttons (ADR 0007 rule 19). Each must appear in that country's emergency claim; a test checks it.
const DIAL = { PH: [['Emergency', '911']], US: [['Emergency', '911']], GB: [['Emergency', '999']], AU: [['Triple Zero', '000']], CA: [['Emergency', '911']],
  SG: [['Ambulance', '995'], ['Police', '999']] };
Object.entries(DIAL).forEach(([code, d]) => { COUNTRIES[code].dial = d; });
const TZ_COUNTRY = {

};
// Time zone first. The language region is used only when there's no time zone, because en-US is common far outside the US.
function guessCountry(tz, langs = []) {
  if (tz) {
    if (TZ_COUNTRY[tz]) return TZ_COUNTRY[tz];
    if (/^America\/(Indiana|Kentucky|North_Dakota)\//.test(tz)) return 'US';
    if (tz.startsWith('Australia/')) return 'AU';
    if (!/^(UTC|Etc\/)/.test(tz)) return 'XX';
  }
  for (const l of langs) { const region = String(l).split('-')[1]?.toUpperCase(); if (region && COUNTRIES[region] && region !== 'XX') return region; }
  return 'XX';
}
function phoneGuess() {
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch { /* no time zone */ }
  return guessCountry(tz, navigator.languages || (navigator.language ? [navigator.language] : []));
}

function helpScreen() {
  const line = (label, num, note) => `<div class="help-line"><div class="label"><span class="small muted">${label}</span><span class="phone">${num}</span>${note ? `<span class="small muted">${note}</span>` : ''}</div>

  const lines = c => c.lines.map(l => line(...l)).join('');
  const c = country();
  const site = (s, label) => `<a href="${s}" target="_blank" rel="noopener">${label || s.replace(/^https:\/\/(www\.)?|\/$/g, '')}</a>`;
  const notEmergency = `It's not an emergency line. In a crisis, call ${crisisText(c)}.`;
  // Chat and website, shared by every kind. A card with no numbers (Canada's provincial lists) says "Find your local line".
  const more = k => `${k.chat ? `${k.chat} ` : ''}${k.site ? `${k.lines.length ? 'Or visit' : 'Find your local line:'} ${site(k.site, k.siteLabel)}. ` : ''}`;
  const kind = (title, get, extra = () => '') => {
    if (!c.crisis) return '';

    const k = get();
    return `<section class="card"><h2>${title}</h2><p class="small muted">${k.about}</p>${lines(k)}${extra(k)}</section>`;
  };
  return `
    <header class="top"><button class="ghost back" data-go="home">${glyph('arrow-left', 18)}Back</button></header>
    <div class="brand"><h1>Get help</h1>
      <p class="small">Help lines for: <b>${c.name}</b> · <button class="link" data-go="country">Change</button></p></div>
    <section class="card urgent" aria-label="Emergency"><span class="eyebrow">Emergency</span><h2>In danger right now?</h2>
      <p>If you're in danger right now, call ${emergencyText(c)}.</p>
      ${(c.dial || []).map(([label, num]) => line(label, num)).join('')}
    </section>
    ${c.crisis ? `<section class="card crisis" aria-label="Crisis support"><h2 class="with-ic"><span class="dot" aria-hidden="true"></span>Crisis support</h2>
      <p class="small muted">Someone to talk to. ${c.crisis().about}</p>${lines(c.crisis())}${c.crisis().chat ? `<p class="small">${c.crisis().chat}</p>` : ''}</section>` : ''}
    <div class="help-grid">
      ${c.directory ? `<section class="card"><h2>Find a help line near you</h2><p class="small muted">${c.directory().about}</p><p>${site(c.directory().site)}</p><p class="small muted">It's a directory, not a help line. If you're in danger, call your local emergency number first.</p></section>` : ''}
      ${kind('Quit smoking or vaping', c.quit, k => `${k.text ? `<p class="small">Or text <b>${k.text[0]}</b> to <span class="num">${k.text[1]}</span>.</p>` : ''}${more(k) ? `<p class="small">${more(k)}</p>` : ''}`)}
      ${kind('Gambling', c.gambling, k => `<p class="small">${more(k)}${notEmergency}</p>`)}
      ${kind('Drug use', c.drugs, k => `<p class="small">${more(k)}${notEmergency}</p>`)}
      <section class="card"><h2>Alcohol</h2><p>${claim('alcohol.doctor')} Get emergency help right away for: ${claim('alcohol.emergency').join(', ').toLowerCase()}.</p></section>
    </div>
    <p class="small muted">Every number re-checked against official sources on 10 Nov 2026. Confirm them again before a public launch.</p>`;
}

// ---------- events ----------
function bind() {
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => go('habit', { id: b.dataset.open })));
  app.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.copy;
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(n).then(() => toast(`Copied ${n}`), () => toast(`Number: ${n}`));
    else toast(`Number: ${n}`);
  }));
  app.querySelectorAll('[data-claim]').forEach(b => b.addEventListener('click', () => {
    const h = habitById(view.id); const r = h.rewards.find(x => x.id === b.dataset.claim);
    r.claimed = true; save(); render(); toast(`Enjoy it: ${r.name}`);
  }));
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
  app.querySelectorAll('[data-slipfor]').forEach(b => b.addEventListener('click', () => slipFor(b.dataset.slipfor)));
  const countryForm = document.getElementById('countryForm');
  if (countryForm) countryForm.addEventListener('submit', e => {
    e.preventDefault();
    const code = val('country');
    if (!COUNTRIES[code]) return;
    state.country = code; save();
    if (view.first) { view = afterShortcut(view.then); render(); } else go('help');
    toast(`Help lines for ${COUNTRIES[code].name}`);
  });
  const reminderForm = document.getElementById('reminderForm');
  if (reminderForm) reminderForm.addEventListener('submit', e => {
    e.preventDefault();
    const time = val('rTime') || '20:00';
    if (downloadReminder(time)) { state.reminder = { time }; save(); render(); toast('Open the file to add it to your calendar'); }
    else toast("Couldn't make the calendar file on this device");
  });
  app.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const icon = b.dataset.icon, group = b.dataset.pick;
    // mark the choice in place so typed text in the form isn't lost
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
    if (group === 'habit') { habitById(view.id).icon = icon; view.iconOpen = false; save(); render(); toast('Icon changed'); }
    if (group === 'reward') view.rewardIcon = icon;
    if (group === 'new') view.draft = { ...(view.draft || {}), icon };
  }));

  const addForm = document.getElementById('addForm');
  if (addForm) {
    const readDraft = () => ({ ...(view.draft || {}), type: val('type'), name: val('name'), start: val('start'), cost: val('cost'), currency: val('currency'),
      rName: val('rName'), rTarget: val('rTarget'), ack: document.getElementById('ack')?.checked });
    document.getElementById('type').addEventListener('change', () => {
      const prev = view.draft || {};
      const d = readDraft();
      // follow the type's default icon unless the user picked one themselves
      if (!prev.icon || prev.icon === TYPE_ICON[prev.type || 'drinking']) d.icon = TYPE_ICON[d.type];
      if (d.type !== (prev.type || 'drinking')) d.ack = false; // each safety notice is ticked on its own
      view.draft = d; render();
    });
    addForm.addEventListener('submit', e => {
      e.preventDefault();
      const d = readDraft();
      if ((d.type === 'drinking' || d.type === 'drugs') && !d.ack) { toast('Please read and tick the doctor notice first'); return; }
      const h = { id: uid(), example: false, type: d.type, icon: d.icon || TYPE_ICON[d.type], name: d.name.trim() || TYPES[d.type], start: d.start || todayKey(), slips: [],
        cost: Math.max(0, Number(d.cost) || 0), currency: d.currency, plans: [], rewards: [] };
      if (d.rName.trim() && Number(d.rTarget) > 0) h.rewards.push({ id: uid(), name: d.rName.trim(), icon: 'gift', kind: 'days', target: Math.round(Number(d.rTarget)), claimed: false });
      state.habits.unshift(h); save(); go('habit', { id: h.id }); toast('Habit added');
    });
  }
  const planForm = document.getElementById('planForm');
  if (planForm) {
    // keep what's been chosen or typed in view.planDraft, so a re-render never loses it
    const readPlan = () => {
      if (document.getElementById('planOwn')) view.planOwnText = val('planOwn');
      if (document.getElementById('planTrigger')) view.planDraft = { t: val('planTrigger'), a: val('planAction'), tOther: val('planTriggerOther') || view.planDraft?.tOther || '', aOther: val('planActionOther') || view.planDraft?.aOther || '' };
    };
    ['planTrigger', 'planAction'].forEach(id => document.getElementById(id)?.addEventListener('change', () => { readPlan(); render(); }));
    ['planTriggerOther', 'planActionOther', 'planOwn'].forEach(id => document.getElementById(id)?.addEventListener('input', () => {
      readPlan();
      const prev = document.getElementById('planPreview'), { t, a } = draftParts(view.planDraft);
      if (prev) prev.innerHTML = t && a ? `<b>${esc(planSentence(t, a))}</b>` : '<span class="muted">Choose both to see your plan.</span>';
    }));
    planForm.addEventListener('submit', e => { e.preventDefault(); readPlan(); toast(submitPlan()); });
  }
  // journal (DDD 7.10): the draft lives in view.jdraft so a re-render never loses typed text
  const jdraft = () => (view.jdraft ||= { mood: 0, note: '', habits: [], triggers: [], ...(state.journal[view.jday || todayKey()] || {}) });
  app.querySelectorAll('[data-jmood]').forEach(b => b.addEventListener('click', () => go('journal', { jdraft: { ...jdraft(), mood: Number(b.dataset.jmood) } })));
  // Picking a mood updates the circles in place (no re-render), so the selection animates smoothly and typed text stays put.
  app.querySelectorAll('[data-mood]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.mood); jdraft().note = val('jNote'); jdraft().mood = n;
    app.querySelectorAll('[data-mood]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const low = document.getElementById('lowMood');
    if (low) { low.innerHTML = n === 1 ? lowMoodNotice() : ''; low.querySelectorAll('[data-go]').forEach(x => x.addEventListener('click', () => go(x.dataset.go))); }
  }));
  app.querySelectorAll('[data-jtag]').forEach(b => b.addEventListener('click', () => {
    const d = jdraft(); d.note = val('jNote'); const id = b.dataset.jtag;
    d.habits = d.habits.includes(id) ? d.habits.filter(x => x !== id) : [...d.habits, id];
    b.setAttribute('aria-pressed', String(d.habits.includes(id)));
  }));
  app.querySelectorAll('[data-jtrig]').forEach(b => b.addEventListener('click', () => {
    const d = jdraft(); d.note = val('jNote'); const id = b.dataset.jtrig; const now = triggersOf(d);
    d.triggers = now.includes(id) ? now.filter(x => x !== id) : [...now, id];
    b.setAttribute('aria-pressed', String(d.triggers.includes(id)));
    // The Other words box shows or hides in place, like #lowMood, so typed text stays put.
    if (id === 'other') { const w = document.getElementById('jOtherWrap'); if (w) w.hidden = !d.triggers.includes('other'); }
  }));
  document.getElementById('jNote')?.addEventListener('input', () => { jdraft().note = val('jNote'); });
  document.getElementById('jOther')?.addEventListener('input', () => { jdraft().otherText = val('jOther'); });
  const journalForm = document.getElementById('journalForm');
  if (journalForm) journalForm.addEventListener('submit', e => {
    e.preventDefault(); const d = jdraft(); d.note = val('jNote'); d.otherText = val('jOther');
    toast(submitJournal(d));
  });
  app.querySelectorAll('[data-jedit]').forEach(b => b.addEventListener('click', () => go('journal', { jday: b.dataset.jedit })));
  app.querySelectorAll('[data-jremove]').forEach(b => b.addEventListener('click', () => removeJournal(b.dataset.jremove)));
  app.querySelectorAll('[data-planremove]').forEach(b => b.addEventListener('click', () => removePlan(Number(b.dataset.planremove))));
  app.querySelectorAll('[data-why]').forEach(b => b.addEventListener('click', () => {
    const h = habitById(view.id); if (!h) return;
    setSlipWhy(h, b.dataset.why); render();
  }));
  const rewardForm = document.getElementById('rewardForm');
  if (rewardForm) rewardForm.addEventListener('submit', e => {
    e.preventDefault();
    const target = Math.round(Number(val('rTarget')));
    if (!val('rName').trim() || !(target > 0)) return;
    habitById(view.id).rewards.push({ id: uid(), name: val('rName').trim(), icon: view.rewardIcon || 'gift', kind: val('rKind'), target, claimed: false });
    view.rewardIcon = 'gift'; view.rewardOpen = false;
    save(); render(); toast('Reward added');
  });
}
const val = id => document.getElementById(id)?.value ?? '';
// Log a slip for today (once per day) and show the bounce-back screen. A slip also counts as today's check-in.
function slipFor(id) {
  const h = habitById(id); if (!h) return;
  const t = todayKey();
  if (!h.slips.includes(t)) h.slips.push(t);
  state.checkin = t;
  save(); go('bounce', { id: h.id });
}

function act(a) {
  if (a === 'skip') { state.demoOffsetDays = (state.demoOffsetDays || 0) + 1; save(); render(); toast('Demo clock: one day later'); }
  if (a === 'resetclock') { state.demoOffsetDays = 0; save(); render(); toast('Back to today'); }
  if (a === 'clearex') { state.habits = state.habits.filter(h => !h.example); state.examples = false; save(); render(); toast('Examples removed'); }
  if (a === 'addex') { state.habits = [...state.habits, ...exampleHabits()]; state.examples = true; save(); render(); toast('Examples loaded'); }
  if (a === 'slip') slipFor(view.id);
  if (a === 'checkin') { state.checkin = todayKey(); save(); render(); }
  if (a === 'checkinslip') {
    if (state.habits.length === 1) slipFor(state.habits[0].id);
    else { view = { name: 'home', pickSlip: true }; render(); }
  }
  if (a === 'cancelslip') { view = { name: 'home' }; render(); }
  if (a === 'hidesamsung') { state.samsungNoteHidden = true; save(); render(); }
  if (a === 'iconopen' || a === 'iconclose') { view.iconOpen = a === 'iconopen'; render(); }
  if (a === 'rewardopen' || a === 'rewardclose') { view.rewardOpen = a === 'rewardopen'; view.rewardIcon = 'gift'; render(); }
  if (a === 'tipsall' || a === 'tipsless') { view.tipsAll = a === 'tipsall'; render(); }
  if (a === 'planopen') { view.planOpen = true; view.planOwn = false; view.planDraft = null; render(); }
  if (a === 'planclose') { view.planOpen = false; view.planOwn = false; view.planDraft = null; render(); }
  if (a === 'planown') { view.planOwn = true; render(); }
  if (a === 'planlist') { view.planOwn = false; render(); }
  if (a === 'jtoday') go('journal');
  if (a === 'theme') { state.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); render(); }
  if (a === 'delete') {
    if (!view.confirmDelete) { view.confirmDelete = true; render(); return; }
    state.habits = state.habits.filter(h => h.id !== view.id); save(); go('home'); toast('Habit deleted');
  }
}

// ---------- start ----------
// A home-screen shortcut opens ./?checkin=clean or ./?checkin=slip (ADR 0008). Read it once, then tidy the address.
let shortcut = null;
try { shortcut = new URLSearchParams(location.search || '').get('checkin'); if (shortcut) history.replaceState(null, '', location.pathname); } catch { /* no shortcut */ }
function afterShortcut(sc) {
  if (sc === 'clean' && state.habits.length) return { name: 'home', confirmClean: true };
  if (sc === 'slip' && state.habits.length) return { name: 'home', pickSlip: true };
  return { name: 'home' };
}
const saved = load();
if (saved && Array.isArray(saved.habits)) state = { demoOffsetDays: 0, ...saved };
else if (!IS_SITE) { state.habits = exampleHabits(); save(); } // the claude.ai demo starts with examples
else state.examples = false;                                      // the installed app starts fresh
if (IS_SITE && !state.siteFresh) { // once: clear demo examples saved before this rule; real habits are never touched
  state.habits = state.habits.filter(h => !h.example); state.examples = false; state.demoOffsetDays = 0; state.siteFresh = true; save();
}
state.habits.forEach(plansOf); // older single-plan habits move into the list (DDD 7.8)
if (!state.journal || typeof state.journal !== 'object' || Array.isArray(state.journal)) state.journal = {}; // saves from before the journal (DDD 7.10)
if (location.hash === '#help') view = { name: 'help' };
else if (IS_SITE && !COUNTRIES[state.country]) view = { name: 'country', first: true, then: shortcut }; // first launch: "Where are you?"
else view = afterShortcut(shortcut);
applyTheme();
render();
</script>

<script>
// Offline support: register the service worker if the browser has one. The app works without it.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
